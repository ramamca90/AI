# Shared upstream settings. Host is intentionally left at nginx's default
# ($proxy_host): Azure Container Apps routes internal traffic by Host header.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Correlation-ID $correlation_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Retry only idempotent requests (nginx never retries POST by default).
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_intercept_errors off;
