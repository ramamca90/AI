# Virtual uv workspace root. Each service and the shared library is its own
# installable package; the root only holds dev tooling and shared config.

[tool.uv.workspace]
members = ["libs/common", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "ASYNC109", "ASYNC110"]
"**/migrations/**" = ["N999"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -q"
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]

[tool.ruff.lint.isort]
known-first-party = ["orderflow_common", "identity_service", "orders_service", "notification_service"]
