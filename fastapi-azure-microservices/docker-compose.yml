# Local environment that mirrors the Azure topology:
#   gateway (public) -> identity / orders / notification (private)
#   Postgres (database per service) + Redis Streams (stand-in for Service Bus)
#
#   docker compose up --build
#   then open http://localhost:8080  (gateway) or the per-service /docs below.
name: orderflow

x-service-env: &service-env
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  JWT_SECRET: local-only-jwt-secret-please-change-me-0123456789
  EVENT_BUS_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  RUN_MIGRATIONS: "true"

x-python-service: &python-service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args: { SERVICE: identity-service, SERVICE_MODULE: identity_service }
    image: orderflow/identity-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: identity-service
      DATABASE_URL: postgresql+asyncpg://orderflow:orderflow@postgres:5432/identity
    ports: ["8001:8000"]

  orders-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args: { SERVICE: orders-service, SERVICE_MODULE: orders_service }
    image: orderflow/orders-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: orders-service
      DATABASE_URL: postgresql+asyncpg://orderflow:orderflow@postgres:5432/orders
    ports: ["8002:8000"]

  notification-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args: { SERVICE: notification-service, SERVICE_MODULE: notification_service }
    image: orderflow/notification-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: notification-service
      EVENT_SUBSCRIPTION: notification-service
      DATABASE_URL: postgresql+asyncpg://orderflow:orderflow@postgres:5432/notifications
    ports: ["8003:8000"]

  gateway:
    build: ./gateway
    image: orderflow/gateway:local
    restart: unless-stopped
    depends_on:
      identity-service: { condition: service_healthy }
      orders-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    ports: ["8080:8080"]

volumes:
  pgdata:
