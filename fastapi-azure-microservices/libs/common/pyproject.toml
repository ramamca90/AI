[project]
name = "orderflow-common"
version = "0.1.0"
description = "Shared platform library for OrderFlow services: config, logging, telemetry, auth, events, persistence."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "redis>=5.0.1",
    "azure-servicebus>=7.12",
    "azure-identity>=1.17",
    "aiohttp>=3.9",
    "azure-monitor-opentelemetry>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderflow_common"]
