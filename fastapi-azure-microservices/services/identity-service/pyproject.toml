[project]
name = "identity-service"
version = "0.1.0"
description = "OrderFlow identity: user registration and JWT issuing."
requires-python = ">=3.12"
dependencies = ["orderflow-common", "argon2-cffi>=23.1"]

[tool.uv.sources]
orderflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
