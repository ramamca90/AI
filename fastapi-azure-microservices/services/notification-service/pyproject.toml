[project]
name = "notification-service"
version = "0.1.0"
description = "OrderFlow notifications: consumes domain events, stores user notifications."
requires-python = ">=3.12"
dependencies = ["orderflow-common"]

[tool.uv.sources]
orderflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]
