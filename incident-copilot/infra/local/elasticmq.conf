# Local SQS for docker-compose.yml. Mirrors the AWS queue: same redrive and visibility timeout.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  incident-jobs {
    defaultVisibilityTimeout = 1080 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "incident-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  incident-jobs-dlq { }
}
