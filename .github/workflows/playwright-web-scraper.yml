name: playwright-web-scraper CI

on:
  push:
    branches: [main]
    paths: ["playwright-web-scraper/**", ".github/workflows/playwright-web-scraper.yml"]
  pull_request:
    paths: ["playwright-web-scraper/**", ".github/workflows/playwright-web-scraper.yml"]

defaults:
  run:
    working-directory: playwright-web-scraper

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: playwright-web-scraper/pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing
