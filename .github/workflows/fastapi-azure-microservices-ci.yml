name: fastapi-azure-microservices CI

on:
  push:
    branches: [main]
    paths: ["fastapi-azure-microservices/**", ".github/workflows/fastapi-azure-microservices-*.yml"]
  pull_request:
    paths: ["fastapi-azure-microservices/**", ".github/workflows/fastapi-azure-microservices-*.yml"]

concurrency:
  group: fastapi-azure-microservices-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: fastapi-azure-microservices

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - libs/common
          - services/identity-service
          - services/orders-service
          - services/notification-service
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15 # enables the Redis Streams integration tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run pytest ${{ matrix.package }}/tests

  images:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad image must not hide the others' results
      matrix:
        include:
          - { name: identity-service, module: identity_service }
          - { name: orders-service, module: orders_service }
          - { name: notification-service, module: notification_service }
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -f docker/python-service.Dockerfile \
            --build-arg SERVICE=${{ matrix.name }} \
            --build-arg SERVICE_MODULE=${{ matrix.module }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ${{ matrix.name }}:ci .
      - name: Scan image for HIGH/CRITICAL CVEs
        # Pinned to a commit SHA, not a tag: tags can be moved or deleted
        # (as happened to this action in March 2026). Bump via Dependabot/Renovate.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gateway:ci gateway
      - name: Validate nginx config renders
        run: |
          docker run --rm --add-host identity-service:127.0.0.1 \
            --add-host orders-service:127.0.0.1 --add-host notification-service:127.0.0.1 \
            gateway:ci sh -c '/docker-entrypoint.sh nginx -t'

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep
